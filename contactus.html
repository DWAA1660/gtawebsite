<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - GT Aeronautics</title>
    <meta name="description" content="Contact GT Aeronautics. We are located in Cody, Wyoming. Phone & FAX: (307) 587-5221.">
    <link rel="stylesheet" href="css/styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Oswald:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <!-- Navigation -->
    <div id="navbar-placeholder"></div>

    <!-- Page Header -->
    <header class="page-header">
        <div class="container">
            <h1>Contact Us</h1>
            <p>Get in touch with our team</p>
        </div>
    </header>

    <!-- Main Content -->
    <section class="section">
        <div class="container">
            <div class="contact-wrapper">
            <div class="contact-grid">
                    <div class="contact-info">
                        <h3>Mailing Address</h3>
                        <p><strong>GT AERONAUTICS, LLC</strong></p>
                        <p>Attn: Thomas W. Rullman</p>
                        <p>26 Elk Road</p>
                        <p>Cody, WY 82414-7810</p>
                    </div>
                    
                    <div class="contact-methods">
                        <h3>Reach Us At</h3>
                        <div class="contact-item">
                            <div class="icon-box">
                                <i class="fas fa-phone"></i>
                            </div>
                            <div>
                                <span>Phone & FAX</span>
                                <strong>(307) 587-5221</strong>
                            </div>
                        </div>
                        
                        <div class="contact-item">
                            <div class="icon-box">
                                <i class="fas fa-envelope"></i>
                            </div>
                            <div>
                                <span>Email</span>
                                <strong>info@gtaeronautics.com</strong>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="map-container">
                    <iframe 
                        width="100%" 
                        height="100%" 
                        id="gmap_canvas" 
                        src="https://maps.google.com/maps?q=26+Elk+Road,+Cody,+WY+82414&t=&z=15&ie=UTF8&iwloc=&output=embed" 
                        frameborder="0" 
                        scrolling="no" 
                        marginheight="0" 
                        marginwidth="0"
                        title="GT Aeronautics Location">
                    </iframe>
                </div>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <div id="footer-placeholder"></div>

    <script src="js/components.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
